<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing Process</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <style>
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <main class="container mx-auto px-6 py-10 h-screen overflow-y-auto">
      <!-- Prediction Algorithm and Forecast Date -->
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6"
        data-aos="fade-up"
      >
        <div>
          <label for="algorithm" class="block text-gray-700 font-bold mb-2"
            >Prediction Algorithm</label
          >
          <select
            id="algorithm"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="svm">SVM (Daily Weather Data)</option>
            <option value="lstm">LSTM (Daily Weather Data)</option>
          </select>
        </div>
        <div>
          <label for="forecastDate" class="block text-gray-700 font-bold mb-2"
            >Forecast Date</label
          >
          <input
            type="date"
            id="forecastDate"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <!-- Weather Input Fields -->
      <div
        id="dailyData"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6"
      >
        <div>
          <label for="windSpeed" class="block text-gray-700 font-bold mb-2"
            >Wind Gust (m/s)</label
          >
          <input
            type="number"
            id="windSpeed"
            value="0"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="humidity" class="block text-gray-700 font-bold mb-2"
            >Humidity (%)</label
          >
          <input
            type="number"
            id="humidity"
            value="0"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="rainfall" class="block text-gray-700 font-bold mb-2"
            >Rainfall (mm)</label
          >
          <input
            type="number"
            id="rainfall"
            value="0"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="temperature" class="block text-gray-700 font-bold mb-2"
            >Temperature (&deg;C)</label
          >
          <input
            type="number"
            id="temperature"
            value="0"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <!-- Predict Button -->
      <div class="text-center" data-aos="zoom-in">
        <button
          id="predictButton"
          class="w-full md:w-auto px-6 py-2 bg-blue-600 text-white font-bold rounded-md hover:bg-blue-500 transition"
        >
          Predict Wind Speed
        </button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      AOS.init({ duration: 1000, once: true });

      document
        .getElementById("algorithm")
        .addEventListener("change", function () {
          const dailyData = document.getElementById("dailyData");
          dailyData.classList.remove("hidden");
        });

      document
        .getElementById("predictButton")
        .addEventListener("click", async () => {
          const algorithm = document.getElementById("algorithm").value;
          const forecastDate = document.getElementById("forecastDate").value;

          const payload = {
            forecast_date: forecastDate,
            temperature: parseFloat(
              document.getElementById("temperature").value
            ), // TX
            humidity: parseFloat(document.getElementById("humidity").value), // RH_AVG
            rainfall: parseFloat(document.getElementById("rainfall").value), // RR
            wind_gust: parseFloat(document.getElementById("windSpeed").value), // FF_X
          };

          try {
            const response = await fetch(`/predict/${algorithm}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            const result = await response.json();
            if (!response.ok) {
              throw new Error(result.error);
            }

            // Expect result as an array of predictions
            const dates = result.map((item) => item.date);
            const windSpeeds = result.map((item) => item.prediction.toFixed(2));

            displayPopup(dates, windSpeeds);
          } catch (error) {
            console.error("Prediction error:", error);
            alert(`Error: ${error.message}`);
          }
        });

      function displayPopup(dates, windSpeeds) {
        const popup = document.createElement("div");
        popup.className =
          "fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center";
        popup.innerHTML = `
      <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        <h2 class="text-xl font-bold mb-4 text-center">3-Day Wind Speed Forecast</h2>
        <canvas id="forecastChart" width="400" height="200"></canvas>
        <button id="closePopup" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg w-full">Close</button>
      </div>
    `;
        document.body.appendChild(popup);

        renderChart(dates, windSpeeds);

        document.getElementById("closePopup").addEventListener("click", () => {
          popup.remove();
        });
      }

      function renderChart(dates, windSpeeds) {
        const ctx = document.getElementById("forecastChart").getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: dates,
            datasets: [
              {
                label: "Wind Speed (m/s)",
                data: windSpeeds,
                borderColor: "rgba(75, 192, 192, 1)",
                borderWidth: 2,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "Date",
                },
              },
              y: {
                title: {
                  display: true,
                  text: "Wind Speed (m/s)",
                },
              },
            },
          },
        });
      }
    </script>
  </body>
</html>
