<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeWind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }

      #logo-container:hover {
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white h-screen overflow-hidden relative">
    <!-- Background Overlay -->
    <div
      class="absolute top-0 left-0 w-full h-full bg-cover bg-center z-0"
      style="background-image: url('../static/images/background.png')"
    ></div>
    <div
      class="absolute top-0 left-0 w-full h-full bg-black opacity-40 z-0"
    ></div>

    <header class="fixed top-0 left-0 w-full z-10">
      <nav
        class="flex justify-between items-center px-6 md:px-12 py-4 bg-transparent"
      >
        <!-- Logo -->
        <div id="logo-container" class="flex items-center space-x-3">
          <img
            src="../static/images/logo.png"
            alt="MeWind Logo"
            class="w-10 md:w-12 h-auto"
            href="{{ url_for('index') }}"
          />
          <span class="text-lg md:text-xl font-semibold text-white"
            >MeWind</span
          >
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex space-x-6 items-center">
          <a
            href="{{ url_for('index') }}"
            class="text-white text-sm md:text-base font-medium hover:text-blue-400 transition"
            >Home</a
          >
          <a
            href="{{ url_for('history') }}"
            class="text-white text-sm md:text-base font-medium hover:text-blue-400 transition"
            >History</a
          >
          <a
            href="{{ url_for('about') }}"
            class="text-white text-sm md:text-base font-medium hover:text-blue-400 transition"
            >About Us</a
          >
          <a
            href="{{ url_for('forecast') }}"
            class="bg-blue-600 text-white text-sm md:text-base font-medium py-2 px-6 rounded-full hover:bg-blue-500 transition inline-block"
            >Forecast</a
          >
        </div>

        <!-- Mobile Menu -->
        <button
          class="block md:hidden text-white focus:outline-none"
          id="menu-button"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16m-7 6h7"
            />
          </svg>
        </button>
      </nav>

      <!-- Mobile Dropdown Menu -->
      <div
        id="mobile-menu"
        class="hidden flex flex-col items-center space-y-4 bg-gray-800 bg-opacity-90 p-6 text-center md:hidden"
      >
        <a
          href="{{ url_for('index') }}"
          class="text-white text-sm font-medium hover:text-blue-400 transition"
          >Home</a
        >
        <a
          href="history.html"
          class="text-white text-sm font-medium hover:text-blue-400 transition"
          >History</a
        >
        <a
          href="{{ url_for('about') }}"
          class="text-white text-sm font-medium hover:text-blue-400 transition"
          >About Us</a
        >
        <a
          href="{{ url_for('forecast') }}"
          class="bg-blue-600 text-white text-sm font-medium py-2 px-6 rounded-full hover:bg-blue-500 transition"
          >Forecast</a
        >
      </div>
    </header>

    <!-- Main Content -->
    <main
      class="relative flex flex-col justify-center items-center h-full z-10 px-4 text-center"
    >
      <div class="flex flex-col items-center mb-6">
        <img src="../static/images/logo.png" alt="MeWind Logo" class="w-32 h-auto mb-4" />
        <h1 class="text-4xl md:text-5xl font-bold text-white drop-shadow-lg">
          MeWind
        </h1>
      </div>
      <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 shadow-lg">
        FORECAST DAILY WIND SPEED IN TANJUNGPINANG WITH US, NOW!
      </h2>
      <p class="text-base md:text-lg text-gray-300 mb-6">
        Discover the Power of Dual-Algorithm for Wind Speed Prediction
      </p>
      <a
        href="{{ url_for('forecast') }}"
        class="bg-blue-600 text-white font-semibold py-3 px-8 rounded-full hover:bg-blue-400 transition drop-shadow-lg"
        >Forecast now!</a
      >
    </main>

    <!-- Footer -->
    <footer class="absolute bottom-4 left-0 w-full text-center z-10">
      <p class="text-sm text-gray-400">
        © 2024. Developed passionately by
        <span class="text-blue-400 font-semibold">WindScholars</span>
      </p>
    </footer>

    <script>
      const menuButton = document.getElementById("menu-button");
      const mobileMenu = document.getElementById("mobile-menu");

      menuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });
    </script>
  </body>
</html>
